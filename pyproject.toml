[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clause-cite"
version = "0.1.0"
description = "Sözleşme, yönetmelik ve şartname metinlerini kanıtlı (alıntı + satır aralığı) aksiyon maddelerine çeviren deterministik çıkarım motoru."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Furkan Acar", email = "284462468+acar32furkan-glitch@users.noreply.github.com" }]
keywords = ["contract", "clause", "extraction", "citation", "turkish", "compliance", "cli", "deterministic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

# Dev araçları PEP 735 bağımlılık grubundadır (extras DEĞİL): `uv sync --all-extras --dev`
# kombinasyonunda extras düşüyor ve CI'da ruff/mypy kayboluyordu.
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-pyyaml",
]

[project.scripts]
clause-cite = "clause_cite.cli:main"

[project.urls]
Homepage = "https://github.com/acar32furkan-glitch/clause-cite"

[tool.hatch.build.targets.wheel]
packages = ["src/clause_cite"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["golden: altın set regresyon vakaları"]

[tool.coverage.run]
branch = true
source = ["clause_cite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "EM", "ISC", "ICN", "LOG", "G", "PIE", "PT", "Q", "RUF", "RET", "SIM", "TID", "ARG", "PTH", "PL", "TRY", "S", "BLE", "FBT", "ANN", "D"]
ignore = [
  "D203", "D213", "D407", "D406", "D413", "D416", "D105", "D107",
  "TRY003", "TRY300", "TRY004", "EM101", "EM102",
  "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR2004",
  "ANN401", "S603", "S607", "S105", "S106", "FBT001", "FBT002", "RUF012", "SIM102",
  # Proje Türkçe metinlerle çalışır: diakritikler ve "'" gibi işaretler kasıtlıdır.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN201", "ANN001", "D103", "D100", "D104", "ARG001"]
"src/clause_cite/cli.py" = ["T201", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
